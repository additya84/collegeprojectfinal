<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCA Syllabus</title>
    <link rel="stylesheet" href="syllabus.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<div class="dashboard">
    <button class="sidebar-toggle" id="sidebarToggle" aria-label="Menu">
        <i class="fa-solid fa-bars"></i>
    </button>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="sidebar" id="sidebar">
        <div class="logo">
            <i class="fa-solid fa-graduation-cap"></i>
            <div class="logo-text">
                <h2>BCA Hub</h2>
                <p>Learn • Practice • Grow</p>
            </div>
        </div>
        <div class="menu">
            <a href="../dashboard.html"><div class="menu-item"><i class="fa-solid fa-house"></i><span>Dashboard</span></div></a>
            <a href="../pages/notes/notes.html"><div class="menu-item"><i class="fa-solid fa-book"></i><span>Notes</span></div></a>
            <a href="../pages/coding/index.html"><div class="menu-item"><i class="fa-solid fa-code"></i><span>Coding</span></div></a>
            <a href="./syllabus.html"><div class="menu-item active"><i class="fa-solid fa-file-lines"></i><span>Syllabus</span></div></a>
            <a href="../papers/index.html"><div class="menu-item"><i class="fa-solid fa-file-pdf"></i><span>Previous Papers</span></div></a>
            <a href="../quiz/index.html"><div class="menu-item"><i class="fa-solid fa-clipboard-question"></i><span>Quiz</span></div></a>
            <a href="../placement/index.html"><div class="menu-item"><i class="fa-solid fa-briefcase"></i><span>Placement</span></div></a>
            <a href="../community/index.html"><div class="menu-item"><i class="fa-solid fa-users"></i><span>Community</span></div></a>
            <a href="../profile/profile.html"><div class="menu-item"><i class="fa-solid fa-user"></i><span>Profile</span></div></a>
        </div>
        
        <!-- User Profile Card in Sidebar -->
        <div class="sidebar-profile" style="margin-top:auto; padding:16px; border-top:1px solid #e2e8f0;">
            <a href="../profile/profile.html" style="text-decoration:none; color:inherit; display:flex; align-items:center; gap:12px;">
                <img id="sidebarAvatar" src="../../assets/images/profile.png" alt="Profile" style="width:44px;height:44px;border-radius:50%;object-fit:cover;">
                <div>
                    <h4 id="sidebarName" style="font-size:15px;font-weight:600;margin:0;color:#1e293b;">Student</h4>
                    <span id="sidebarCourse" style="font-size:13px;color:#64748b;">BCA Student</span>
                </div>
            </a>
        </div>
    </div>

    <div class="main-content">

        <div class="page-header" style="padding:20px 0; text-align:center;">
            <h1 style="font-size:32px; color:#1e293b; margin:0;">BCA Syllabus</h1>
        </div>

        <div class="semester-buttons">
            <button onclick="loadSemester(1)">Semester 1</button>
            <button onclick="loadSemester(2)">Semester 2</button>
            <button onclick="loadSemester(3)">Semester 3</button>
            <button onclick="loadSemester(4)">Semester 4</button>
            <button onclick="loadSemester(5)">Semester 5</button>
            <button onclick="loadSemester(6)">Semester 6</button>
        </div>

        <div class="content">
            <div class="table-box">
                <h2 id="semesterTitle">Semester 1 Subjects & Marks Distribution</h2>
                <table id="subjectTable"></table>
            </div>
            <section class="syllabus-content" id="syllabusContent">
                <h2>Detailed Syllabus - Semester 1</h2>
            </section>
        </div>
    </div>
</div>

<script src="syllabus.js"></script>
<script src="../js/common.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
    var toggle = document.getElementById("sidebarToggle");
    var sidebar = document.getElementById("sidebar");
    var overlay = document.getElementById("sidebarOverlay");
    if (toggle && sidebar) {
        toggle.addEventListener("click", function () {
            sidebar.classList.toggle("open");
            if (overlay) overlay.classList.toggle("show");
        });
        if (overlay) {
            overlay.addEventListener("click", function () {
                sidebar.classList.remove("open");
                overlay.classList.remove("show");
            });
        }
    }
});
</script>
</body>
</html>
